[project]
name = "yt-scraper"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "AnushSingla", email = "singlaanush18@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "faster-whisper>=1.2.1",
    "python-dotenv>=1.2.3",
    "qdrant-client>=1.19.0",
    "requests>=2.34.2",
    "sentence-transformers>=6.0.1",
    "static-ffmpeg>=3.0",
    "uvicorn>=0.52.4",
    "yt-dlp>=2026.8.19",
]

[project.scripts]
yt-scraper = "yt_scraper:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
